    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## What is the API?

Remapping rules live in an app-db table.

```edn
{:db-id 7 ;; postgres (db lives in connection string)
 :from-db "" :from-schema "public"          :from-table "orders"
 :to-db ""    :to-schema  "my_other_schema" :to-table "fake_orders"}
 
 {:db-id 8 ;; mysql (has no schemas)
  :from-db "my_real_database" :from-schema "" :from-table "orders"
  :to-db "my_other_database"  :to-schema ""   :to-table "fake_orders"}
```
</div>

<aside class="notes"><ul>
<li>One row per substitution. No user, no role, no workspace field — anything that wants identity routing produces this row.</li>
<li>&quot;&quot; sentinel for &quot;this driver doesn&#39;t emit this level.&quot; Postgres has no top-level db slot, MySQL has no schemas.</li>
<li>Why &quot;&quot; not NULL? Postgres/MySQL/H2 treat NULL != NULL in unique indexes; &quot;&quot; lets the (db_id, db, schema, table) unique constraint work cross-driver.</li>
<li>BigQuery fun-fact is the AST-positions punchline. Don&#39;t over-explain; just let it land.</li>
</ul>
</aside></script></section><section ><section data-separator="?

## Phase 1
(swap names early in QP middlewares)

QP middleware reads `:schema`/`:name` off `:metadata/Table` to build joins, aliases, and cache keys.
<!-- .element: class="fragment" -->

We flip those up front so the rest of the pipeline agrees with the SQL Phase 2 will emit.
<!-- .element: class="fragment" -->
</div>

<aside class="notes"><ul>
<li>Phase 2 alone is enough for safety. Phase 1 exists for <em>pipeline consistency</em>.</li>
<li>Concrete example: add_implicit_joins reads :name off :metadata/table and uses it as the JOIN alias. Without Phase 1, alias = canonical name but the table ref = target. Internally inconsistent SQL.</li>
<li>Slogan recurrence: &quot;Same lie, told consistently.&quot;</li>
<li>Expected pushback: &quot;why bother if Phase 2 is the boundary?&quot; — Answer: middleware reads metadata, so we&#39;d be lying to the SQL but truth-telling the middleware. That&#39;s worse than lying to both.</li>
</ul>
</aside></script></section><section data-separator="?

## Phase 2
(SQLGlot SQL Rewrite)
```clojure
;; Postgres Example, from public -> ws_alice schema for 2 tables
[{:db-id 7  :from-schema "public"   :from-table "orders"
            :to-schema   "ws_alice" :to-table   "orders"}

 {:db-id 7  :from-schema "public"   :from-table "customers"
            :to-schema   "ws_alice" :to-table   "customers"}]
```

Compiled query
<!-- .element: class="fragment" -->

```sql
SELECT o.id, c.email, o.total
-- public.orders in a comment
FROM   public.orders o
JOIN   public.customers c ON c.id = o.customer_id
WHERE  o.total > 100;
```
<!-- .element: class="fragment" -->

Remapped
<!-- .element: class="fragment" -->

```sql
SELECT o.id, c.email, o.total
-- public.orders in a comment
FROM   ws_alice.orders o
JOIN   ws_alice.customers c ON c.id = o.customer_id
WHERE  o.total > 100;
```
<!-- .element: class="fragment" -->
</div>

<aside class="notes"><ul>
<li>Walk through reveals: 2 rules → compiled query (canonical) → remapped query.</li>
<li>Point at the comment line in both SQL blocks. The comment text &quot;public.orders&quot; survives unchanged because SQLGlot is AST-aware, not text-replace. That&#39;s the proof-it-isn&#39;t-stupid moment.</li>
<li>Proof point if asked: SQLGlot parses all 12,511 saved queries in Metabase&#39;s query corpus across 7 dialects with 0 errors.</li>
<li>Fails closed: if SQLGlot can&#39;t parse, query never executes. No silent fallback to canonical.</li>
</ul>
</aside></script></section></section><section ><section data-separator="?

### 1. `Query Execution`:
Queries need to read from remapped tables, so we lie by rewriting queries pointing pointing at tables

This automatically works with:
<!-- .element: class="fragment" -->
- MBQL
<!-- .element: class="fragment" -->
- native queries w/ template tags, table tags, snippets, optional query clauses etc.
<!-- .element: class="fragment" -->
- sandboxing
<!-- .element: class="fragment" -->
- probably more
<!-- .element: class="fragment" -->
</div>

<aside class="notes"><ul>
<li>The boundary is downstream of every other middleware. Means we get template-tag expansion, snippet inlining, sandbox filters, parameter substitution all <em>for free</em> — by the time Phase 2 runs, the query is a single SQL string.</li>
<li>&quot;Probably more&quot; is honest — there are surfaces we haven&#39;t audited (writeback, persistence, action DDL). Those are refused on workspace child for now.</li>
</ul>
</aside></script></section><section data-separator="?

### 2. `Transform` Runs:

in workspace mode we lie by automatically redirecting the table created by the transform
</div>

<aside class="notes"><ul>
<li>Write path. Transform declares target = (canonical_schema, foo). Hook in the executor rewrites to the workspace temp schema AND inserts the remapping row.</li>
<li>After this, future reads route through Phase 1/2 back to canonical.</li>
</ul>
</aside></script></section><section data-separator="?

### 3. `Syncing`:

sync reads from the **target** table, and stores it _as_ the **canonical** table as a `:model/Table` row.

We lie here because `:model/Table` rows are read in 20x more places than the driver boundary is touched.
<!-- .element: class="fragment" -->
</div>

<aside class="notes"><ul>
<li>The design choice slide. Rejected alternative: create a new :model/Table row for every target table. That route breaks Search, Serdes, Permissions, recent_views, picker — every subsystem that assumes one row per warehouse table.</li>
<li>20x figure is the punchline. State it slow.</li>
<li>Slogan recurrence (third time): &quot;Lie once, in the right place.&quot; Optional close to the slide if you want to land it verbally.</li>
</ul>
</aside></script></section></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### V1 Limitations

**No transitive remapping** A → B, B → C not supported. Not needed for Workspaces.
<!-- .element: class="fragment" -->

**Bare table references** (select * from orders) in native queries are not remapped
<!-- .element: class="fragment" -->
</div>

<aside class="notes"><ul>
<li>Honest scope. V1 boundary slide.</li>
<li>Bare-table: native <code>SELECT * FROM orders</code> (no schema) leaks. Needs a future driver primitive: &quot;given a bare name, what schema would the warehouse pick?&quot; (Postgres has to_regclass; others vary.)</li>
<li>Other things deferred (don&#39;t volunteer unless asked): cache invalidation hook, serdes hooks, deprovision-clears-remappings, session-scoped remappings.</li>
</ul>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

</div>

<aside class="notes"><ul>
<li>Likely questions:<ul>
<li>&quot;What about cross-DB workspaces?&quot; it depends what &quot;DB&quot; means: MySQL flipped its <code>qualified-name-components</code> to populate <code>:db</code> so cross-DB MySQL works. Snowflake/SQL Server/BQ similarly. Postgres/Redshift/CH stay 2-slot. </li>
<li>&quot;DB Routing × Workspaces?&quot; → Mutually exclusive on the same DB. Phase 2 refuses if a destination DB is bound.</li>

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const [_, c_r, c_g, c_b] = normalizedColor.match(/(\d+), (\d+), (\d+)/);

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
