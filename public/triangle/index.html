<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Triangle Platformer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0b; }
      #hud { position: fixed; top: 62px; left: 8px; color: #bbb; font: 12px/1.4 monospace; white-space: pre; }
      .float { position: fixed; transform: translate(-50%, -100%); font: bold 18px monospace; pointer-events: none;
               animation: rise 0.8s ease-out forwards; }
      .dmg { color: #ffd54f; text-shadow: 0 0 3px #000; }
      .lvl { color: #4fc3f7; font-size: 22px; }
      .crit { color: #ff9800; font-size: 24px; }
      .hurt { color: #ef5350; text-shadow: 0 0 3px #000; }
      /* above every world label (doors, statues, popups) */
      #tree { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; z-index: 50; }
      #speech { position: fixed; transform: translate(-50%, -100%); display: none; max-width: 460px; padding: 10px 12px;
                background: rgba(20,20,20,0.94); border: 1px solid #444; color: #ccc; font: 13px/1.5 monospace; pointer-events: none; }
      #speech b { color: #fff; }
      .npc { color: #aaa; font-size: 12px; }
      .door { position: fixed; transform: translate(-50%, -100%); color: #4fc3f7; font: bold 13px monospace;
              pointer-events: none; white-space: nowrap; }
      .heal { color: #66bb6a; text-shadow: 0 0 3px #000; }
      .hurt { font-size: 22px; }
      /* HP bar: red fill, a white chunk that drains after a hit, numbers on top */
      #hp { position: fixed; top: 26px; left: 8px; width: 280px; height: 26px; background: #2a0d0d; border: 2px solid #555; }
      #hp div { position: absolute; top: 0; bottom: 0; left: 0; }
      #hp-ghost { background: #f5f5f5; }
      #hp-fill { background: #e53935; }
      #hp-text { position: absolute; inset: 0; color: #fff; font: bold 14px/26px monospace; text-align: center; text-shadow: 0 0 3px #000; }
      #hp.low { animation: pulse 0.6s ease-in-out infinite alternate; }
      #hp.healed #hp-fill { background: #66bb6a; }
      #shields { position: fixed; top: 30px; left: 300px; color: #4fc3f7; font: bold 16px monospace; }
      /* XP: full width across the top edge */
      #xp { position: fixed; top: 0; left: 0; right: 0; height: 16px; background: #10202a; border-bottom: 1px solid #333; }
      #xp-fill { position: absolute; top: 0; bottom: 0; left: 0; background: #4fc3f7; transition: width 0.25s ease-out; }
      #xp-text { position: absolute; inset: 0; color: #fff; font: bold 11px/16px monospace; text-align: center; text-shadow: 0 0 3px #000; }
      #xp.up { animation: lvlup 0.6s ease-out; }
      @keyframes lvlup { from { background: #e1f5fe; } to { background: #10202a; } }
      #boss { position: fixed; top: 34px; left: 50%; transform: translateX(-50%); width: 50vw; height: 18px;
              background: #2a1200; border: 2px solid #ff6f00; display: none; }
      #boss-fill { position: absolute; top: 0; bottom: 0; left: 0; background: #ff6f00; }
      #boss span { position: absolute; inset: 0; color: #fff; font: bold 12px/18px monospace; text-align: center; text-shadow: 0 0 3px #000; }
      #summary { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); display: none; padding: 18px 28px;
                 background: rgba(16,16,16,0.95); border: 2px solid #ffd54f; color: #ddd; font: 15px/1.6 monospace; text-align: center; }
      #summary h2 { margin: 0 0 8px; color: #ffd54f; }
      #summary .dim { color: #888; font-size: 13px; }
      #vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(229,57,53,0.75); opacity: 0; }
      #vignette.hit { animation: hit 0.35s ease-out; }
      @keyframes hit { from { opacity: 1; } to { opacity: 0; } }
      @keyframes pulse { from { border-color: #555; } to { border-color: #ff1744; } }
      @keyframes rise { to { transform: translate(-50%, -260%); opacity: 0; } }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="xp"><div id="xp-fill"></div><span id="xp-text"></span></div>
    <div id="hp"><div id="hp-ghost"></div><div id="hp-fill"></div><span id="hp-text"></span></div>
    <div id="shields"></div>
    <div id="vignette"></div>
    <div id="boss"><div id="boss-fill"></div><span>THE WARDEN</span></div>
    <div id="summary"></div>
    <div id="hud"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
